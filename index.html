<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week HUD</title>

  <style>
    :root {
      /* Notion Dark */
      --bg: #191919;

      /* Timeline */
      --track: #3a3a3a;
      --fill: #8b7cf6;

      /* Dots */
      --dot: #686868;
      --current: #9b8cff;

      /* Text */
      --text: #929292;
      --text-current: #f1f1f1;

      /*
        처음 코드와 동일한 핵심 구조
      */
      --h: 52px;
      --xpad: 4px;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: var(--bg);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

      box-sizing: border-box;
    }


    body {
      height: var(--h);
      overflow: hidden;
    }


    /*
      처음 코드의 wrap 구조 유지
    */

    .wrap {
      width: 100%;
      height: 100%;

      padding: 0 var(--xpad);

      box-sizing: border-box;

      display: flex;
      align-items: flex-end;
    }


    /*
      전체 HUD
    */

    .barbox {
      width: 100%;
      height: 43px;

      position: relative;
    }


    /*
      진행선

      첫 번째 점과 마지막 점의
      중앙까지만 연결
    */

 .line {
  position: absolute;

  left: 0;
  right: 0;

  top: 12px;
  height: 3px;

  border-radius: 999px;
  background: var(--track);
  overflow: hidden;
  z-index: 1;
      }


    /*
      진행된 부분
    */

    .fill {
      height: 100%;
      width: 0%;

      background: var(--fill);

      border-radius: 999px;

      transition: width .35s ease;
    }


    /*
      7개 요일
    */

.days {
  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  z-index: 2;
}


/*
  개별 요일
*/

.day {
  position: absolute;

  display: flex;
  flex-direction: column;
  align-items: center;

  color: var(--text);

  font-size: 10px;
  font-weight: 500;
  letter-spacing: .35px;

  user-select: none;

  transform: translateX(-50%);
}


/* SUN - 왼쪽 끝 */
.day:nth-child(1) {
  left: 0%;
  transform: none;
  align-items: flex-start;
}


/* MON */
.day:nth-child(2) {
  left: 16.6667%;
}


/* TUE */
.day:nth-child(3) {
  left: 33.3333%;
}


/* WED */
.day:nth-child(4) {
  left: 50%;
}


/* THU */
.day:nth-child(5) {
  left: 66.6667%;
}


/* FRI */
.day:nth-child(6) {
  left: 83.3333%;
}


/* SAT - 오른쪽 끝 */
.day:nth-child(7) {
  left: 100%;
  transform: translateX(-100%);
  align-items: flex-end;
}


    /*
      점
    */

    .dot {
      width: 11px;
      height: 11px;

      margin-top: 8px;
      margin-bottom: 6px;

      border-radius: 50%;

      background: var(--dot);

      position: relative;

      z-index: 3;
    }


    /*
      현재 요일
    */

    .day.current {
      color: var(--text-current);

      font-weight: 700;
    }


    .day.current .dot {
      width: 14px;
      height: 14px;

      margin-top: 6.5px;
      margin-bottom: 4.5px;

      background: #ffffff;

      border: 3px solid var(--current);

      box-shadow:
        0 0 0 3px rgba(155,140,255,.14),
        0 0 12px rgba(155,140,255,.65);
    }


    /*
      요일 텍스트
    */

    .label {
      line-height: 1;
    }


    /*
      퍼센트

      SAT와 분리.

      처음 코드처럼
      오른쪽 상단에 독립적으로 표시.
    */

    .pct {
      position: absolute;

      right: 4px;
      top: -1px;

      font-size: 10px;
      font-weight: 700;

      line-height: 1;

      color: var(--text-current);

      user-select: none;

      z-index: 10;
    }

  </style>
</head>


<body>

  <div class="wrap">

    <div class="barbox">


      <!-- 퍼센트 -->

      <div
        class="pct"
        id="pct">
        0%
      </div>


      <!-- 진행선 -->

      <div class="line">

        <div
          class="fill"
          id="fill">
        </div>

      </div>


      <!-- 요일 -->

      <div class="days">


        <div
          class="day"
          data-day="0">

          <div class="dot"></div>

          <div class="label">
            SUN
          </div>

        </div>


        <div
          class="day"
          data-day="1">

          <div class="dot"></div>

          <div class="label">
            MON
          </div>

        </div>


        <div
          class="day"
          data-day="2">

          <div class="dot"></div>

          <div class="label">
            TUE
          </div>

        </div>


        <div
          class="day"
          data-day="3">

          <div class="dot"></div>

          <div class="label">
            WED
          </div>

        </div>


        <div
          class="day"
          data-day="4">

          <div class="dot"></div>

          <div class="label">
            THU
          </div>

        </div>


        <div
          class="day"
          data-day="5">

          <div class="dot"></div>

          <div class="label">
            FRI
          </div>

        </div>


        <div
          class="day"
          data-day="6">

          <div class="dot"></div>

          <div class="label">
            SAT
          </div>

        </div>


      </div>

    </div>

  </div>


  <script>

    function update() {

      const now = new Date();

      const day =
        now.getDay();


      /*
        하루 진행률
      */

      const secondsToday =
        now.getHours() * 3600 +
        now.getMinutes() * 60 +
        now.getSeconds();


      const dayProgress =
        secondsToday / 86400;


      /*
        전체 주 진행률

        Sun 00:00 = 0%
        다음 Sun 00:00 = 100%
      */

      const weekPosition =
        day + dayProgress;


      const pct =
        (weekPosition / 7) * 100;


      /*
        선 진행률

        SUN 점 → SAT 점 사이가
        총 6구간이므로 별도로 계산
      */

      let linePct =
        (weekPosition / 6) * 100;


      linePct =
        Math.max(
          0,
          Math.min(
            linePct,
            100
          )
        );


      document
        .getElementById("fill")
        .style.width =
        linePct + "%";


      document
        .getElementById("pct")
        .textContent =
        Math.round(pct) + "%";


      /*
        현재 요일 강조
      */

      const days =
        document.querySelectorAll(
          ".day"
        );


      days.forEach(
        (element, index) => {

          element.classList.remove(
            "current"
          );


          if (index === day) {

            element.classList.add(
              "current"
            );

          }

        }
      );

    }


    update();


    setInterval(
      update,
      60 * 1000
    );

  </script>

</body>
</html>
