<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Week HUD</title>

  <style>

    /* =========================================================
       WEEK HUD
       ---------------------------------------------------------
       Desktop  : 요일 + 영역명
       Compact  : 요일만 표시
       Mobile   : 한 글자 요일

       Google Calendar 영역 색상 기반
       ========================================================= */

    :root {

      /* Notion Dark */
      --bg: #191919;

      /* Text */
      --text-main: #eeeeee;
      --text-sub: #9b9b9b;
      --text-dim: #6f6f6f;

      /* Week Indicator */
      --week-off-bg: #292929;
      --week-off-border: #3a3a3a;
      --week-off-text: #858585;

      --week-active: #4285d4;

      /* =====================================================
         Google Calendar 영역 색상
         캡처 기준 근사값
         ===================================================== */

      /* SUN · 7 Time */
      --sun: #a47ac3;

      /* MON · 1 Health */
      --mon: #e85d3f;

      /* TUE · 2 Space */
      --tue: #f28c38;

      /* WED · 3 Money */
      --wed: #f2c94c;

      /* THU · 4 Work */
      --thu: #51a675;

      /* FRI · 5 Relationship */
      --fri: #4c9ad4;

      /* SAT · 6 Hobby */
      --sat: #7458c7;


      /* Layout */

      --hud-padding-x: 14px;

      --dot-size: 11px;
      --dot-current: 15px;

      --week-size: 25px;

    }


    /* =========================================================
       RESET
       ========================================================= */

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: var(--bg);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

      overflow: hidden;
    }


    body {
      padding:
        8px
        var(--hud-padding-x)
        6px;
    }



    /* =========================================================
       HUD
       ========================================================= */

    .hud {
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      justify-content: center;

      gap: 12px;
    }



    /* =========================================================
       TOP ROW
       WEEK 1 2 3 4 5                         92%
       ========================================================= */

    .top-row {

      width: 100%;

      display: flex;
      align-items: center;

      min-height: 26px;

    }


    .week-label {

      margin-right: 11px;

      color: var(--text-sub);

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 1px;

      user-select: none;

    }



    /* =========================================================
       MONTH WEEK INDICATOR
       ========================================================= */

    .weeks {

      display: flex;
      align-items: center;

      gap: 7px;

    }


    .week {

      width: var(--week-size);
      height: var(--week-size);

      flex: 0 0 var(--week-size);

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: var(--week-off-bg);

      border:
        1px solid
        var(--week-off-border);

      color: var(--week-off-text);

      font-size: 11px;
      font-weight: 600;

      user-select: none;

      transition:
        background .25s ease,
        color .25s ease,
        border-color .25s ease,
        box-shadow .25s ease,
        transform .25s ease;

    }


    .week.active {

      background: var(--week-active);

      border-color: #72a9eb;

      color: #ffffff;

      font-weight: 700;

      transform: scale(1.08);

      box-shadow:
        0 0 0 3px rgba(66,133,212,.13),
        0 0 12px rgba(66,133,212,.55);

    }



    /* =========================================================
       WEEK PROGRESS %
       ========================================================= */

    .progress-percent {

      margin-left: auto;

      color: var(--text-sub);

      font-size: 9px;
      font-weight: 600;

      user-select: none;

      white-space: nowrap;

    }



    /* =========================================================
       TIMELINE
       ========================================================= */

    .timeline {

      width: 100%;
      height: 35px;

      position: relative;

    }



    /* =========================================================
       SEGMENT LINE

       Notion 실제 열 비율:

       SUN 14.29
       MON 14.29
       TUE 14.29
       WED 14.29
       THU 16.07
       FRI 12.50
       SAT 14.29
       ========================================================= */

    .segments {

      position: absolute;

      left: 0;
      right: 0;

      top: 6px;

      height: 3px;

      display: grid;

      grid-template-columns:
        14.29fr
        14.29fr
        14.29fr
        14.29fr
        16.07fr
        12.5fr;

      overflow: hidden;

      border-radius: 999px;

      z-index: 1;

    }


    .segment {
      height: 100%;
    }


    .segment.sun-mon {
      background:
        linear-gradient(
          90deg,
          var(--sun),
          var(--mon)
        );
    }


    .segment.mon-tue {
      background:
        linear-gradient(
          90deg,
          var(--mon),
          var(--tue)
        );
    }


    .segment.tue-wed {
      background:
        linear-gradient(
          90deg,
          var(--tue),
          var(--wed)
        );
    }


    .segment.wed-thu {
      background:
        linear-gradient(
          90deg,
          var(--wed),
          var(--thu)
        );
    }


    .segment.thu-fri {
      background:
        linear-gradient(
          90deg,
          var(--thu),
          var(--fri)
        );
    }


    .segment.fri-sat {
      background:
        linear-gradient(
          90deg,
          var(--fri),
          var(--sat)
        );
    }



    /* =========================================================
       DAYS

       실제 Notion 열 비율 사용
       ========================================================= */

    .days {

      position: absolute;

      inset: 0;

      display: grid;

      grid-template-columns:
        14.29fr
        14.29fr
        14.29fr
        14.29fr
        16.07fr
        12.5fr
        14.29fr;

      z-index: 2;

    }



    /* =========================================================
       DAY
       ========================================================= */

    .day {

      position: relative;

      display: flex;
      flex-direction: column;

      align-items: flex-start;

      color: var(--text-sub);

      font-size: 9px;
      font-weight: 500;

      letter-spacing: .35px;

      user-select: none;

    }



    /* =========================================================
       DOT
       ========================================================= */

    .dot {

      width: var(--dot-size);
      height: var(--dot-size);

      flex: 0 0 var(--dot-size);

      margin-top: 2px;
      margin-bottom: 5px;

      border-radius: 50%;

      position: relative;

      z-index: 3;

      transition:
        width .25s ease,
        height .25s ease,
        box-shadow .25s ease,
        transform .25s ease,
        opacity .25s ease;

    }



    /* =========================================================
       DAY COLORS
       ========================================================= */

    .day.sun .dot {
      background: var(--sun);
    }

    .day.mon .dot {
      background: var(--mon);
    }

    .day.tue .dot {
      background: var(--tue);
    }

    .day.wed .dot {
      background: var(--wed);
    }

    .day.thu .dot {
      background: var(--thu);
    }

    .day.fri .dot {
      background: var(--fri);
    }

    .day.sat .dot {
      background: var(--sat);
    }



    /* =========================================================
       FUTURE DAYS
       살짝 어둡게
       ========================================================= */

    .day.future .dot {
      opacity: .35;
    }


    .day.future {
      color: var(--text-dim);
    }



    /* =========================================================
       CURRENT DAY
       ========================================================= */

    .day.current {

      color: var(--text-main);

      font-weight: 700;

    }


    .day.current .dot {

      width: var(--dot-current);
      height: var(--dot-current);

      flex-basis: var(--dot-current);

      margin-top: 0;
      margin-bottom: 3px;

      border: 3px solid #ffffff;

      transform: scale(1.02);

    }


    .day.sun.current .dot {

      box-shadow:
        0 0 0 3px rgba(164,122,195,.18),
        0 0 13px var(--sun);

    }


    .day.mon.current .dot {

      box-shadow:
        0 0 0 3px rgba(232,93,63,.18),
        0 0 13px var(--mon);

    }


    .day.tue.current .dot {

      box-shadow:
        0 0 0 3px rgba(242,140,56,.18),
        0 0 13px var(--tue);

    }


    .day.wed.current .dot {

      box-shadow:
        0 0 0 3px rgba(242,201,76,.18),
        0 0 13px var(--wed);

    }


    .day.thu.current .dot {

      box-shadow:
        0 0 0 3px rgba(81,166,117,.18),
        0 0 13px var(--thu);

    }


    .day.fri.current .dot {

      box-shadow:
        0 0 0 3px rgba(76,154,212,.18),
        0 0 13px var(--fri);

    }


    .day.sat.current .dot {

      box-shadow:
        0 0 0 3px rgba(116,88,199,.18),
        0 0 13px var(--sat);

    }



    /* =========================================================
       LABELS
       ========================================================= */

    .day-name {

      line-height: 1;

      white-space: nowrap;

    }


    .area-name {

      margin-top: 3px;

      color: var(--text-dim);

      font-size: 8px;

      line-height: 1;

      white-space: nowrap;

    }


    .day.current .area-name {

      color: var(--text-sub);

    }


    .day-short {
      display: none;
    }



    /* =========================================================
       마지막 SAT

       오른쪽 끝에 맞춤
       ========================================================= */

    .day.sat {

      align-items: flex-end;

      text-align: right;

    }



    /* =========================================================
       COMPACT
       iframe 폭이 좁아지면 영역명 제거
       ========================================================= */

    @media (max-width: 750px) {

      :root {
        --hud-padding-x: 10px;
      }


      .area-name {
        display: none;
      }


      .hud {
        gap: 10px;
      }


      .timeline {
        height: 28px;
      }

    }



    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 480px) {

      :root {

        --hud-padding-x: 7px;

        --week-size: 22px;

        --dot-size: 9px;

        --dot-current: 13px;

      }


      body {

        padding-top: 6px;
        padding-bottom: 4px;

      }


      .hud {
        gap: 8px;
      }


      .week-label {
        display: none;
      }


      .weeks {
        gap: 5px;
      }


      .week {

        font-size: 10px;

      }


      .progress-percent {

        font-size: 8px;

      }


      /*
        SUN → S
        MON → M
        ...
      */

      .day-full {
        display: none;
      }


      .day-short {
        display: block;
      }


      .day {

        font-size: 8px;

      }


      .area-name {
        display: none;
      }

    }

  </style>
</head>


<body>


  <div class="hud">


    <!-- =====================================================
         TOP
         ===================================================== -->

    <div class="top-row">


      <div class="week-label">
        WEEK
      </div>


      <div class="weeks">

        <div class="week" data-week="1">1</div>

        <div class="week" data-week="2">2</div>

        <div class="week" data-week="3">3</div>

        <div class="week" data-week="4">4</div>

        <div class="week" data-week="5">5</div>

      </div>


      <div
        class="progress-percent"
        id="progressPercent">
        0%
      </div>


    </div>



    <!-- =====================================================
         TIMELINE
         ===================================================== -->

    <div class="timeline">


      <!-- 색상 연결선 -->

      <div class="segments">

        <div class="segment sun-mon"></div>

        <div class="segment mon-tue"></div>

        <div class="segment tue-wed"></div>

        <div class="segment wed-thu"></div>

        <div class="segment thu-fri"></div>

        <div class="segment fri-sat"></div>

      </div>



      <!-- 요일 -->

      <div class="days">


        <!-- SUN -->

        <div class="day sun">

          <div class="dot"></div>

          <div class="day-name">

            <span class="day-full">
              SUN
            </span>

            <span class="day-short">
              S
            </span>

          </div>

          <div class="area-name">
            Time
          </div>

        </div>



        <!-- MON -->

        <div class="day mon">

          <div class="dot"></div>

          <div class="day-name">

            <span class="day-full">
              MON
            </span>

            <span class="day-short">
              M
            </span>

          </div>

          <div class="area-name">
            Health
          </div>

        </div>



        <!-- TUE -->

        <div class="day tue">

          <div class="dot"></div>

          <div class="day-name">

            <span class="day-full">
              TUE
            </span>

            <span class="day-short">
              T
            </span>

          </div>

          <div class="area-name">
            Space
          </div>

        </div>



        <!-- WED -->

        <div class="day wed">

          <div class="dot"></div>

          <div class="day-name">

            <span class="day-full">
              WED
            </span>

            <span class="day-short">
              W
            </span>

          </div>

          <div class="area-name">
            Money
          </div>

        </div>



        <!-- THU -->

        <div class="day thu">

          <div class="dot"></div>

          <div class="day-name">

            <span class="day-full">
              THU
            </span>

            <span class="day-short">
              T
            </span>

          </div>

          <div class="area-name">
            Work
          </div>

        </div>



        <!-- FRI -->

        <div class="day fri">

          <div class="dot"></div>

          <div class="day-name">

            <span class="day-full">
              FRI
            </span>

            <span class="day-short">
              F
            </span>

          </div>

          <div class="area-name">
            Relationship
          </div>

        </div>



        <!-- SAT -->

        <div class="day sat">

          <div class="dot"></div>

          <div class="day-name">

            <span class="day-full">
              SAT
            </span>

            <span class="day-short">
              S
            </span>

          </div>

          <div class="area-name">
            Hobby
          </div>

        </div>


      </div>


    </div>


  </div>



  <script>

    /* =========================================================
       MONTH WEEK

       일반적인 일요일 시작 달력 기준.

       예:
       달의 첫 번째 달력 행 = 1주차

       6번째 행이 생기는 달은 현재 UI가 1~5이므로
       임시로 5주차로 처리.

       추후 계산 규칙만 교체 가능.
       ========================================================= */

    function getWeekOfMonth(date) {

      const year =
        date.getFullYear();


      const month =
        date.getMonth();


      const firstDay =
        new Date(
          year,
          month,
          1
        );


      const firstWeekday =
        firstDay.getDay();


      const currentDate =
        date.getDate();


      const week =
        Math.ceil(
          (
            currentDate +
            firstWeekday
          ) / 7
        );


      return Math.min(
        Math.max(
          week,
          1
        ),
        5
      );

    }



    /* =========================================================
       UPDATE HUD
       ========================================================= */

    function updateHUD() {


      /*
        방문자 기기의 현지 시간
      */

      const now =
        new Date();



      /* =======================================================
         MONTH WEEK
         ======================================================= */

      const currentWeek =
        getWeekOfMonth(now);


      document
        .querySelectorAll(".week")
        .forEach(
          element => {


            const week =
              Number(
                element.dataset.week
              );


            element
              .classList
              .toggle(
                "active",
                week === currentWeek
              );


          }
        );



      /* =======================================================
         DAY
         ======================================================= */

      const currentDay =
        now.getDay();


      document
        .querySelectorAll(".day")
        .forEach(
          (element, index) => {


            element.classList.remove(
              "past",
              "current",
              "future"
            );


            if (index < currentDay) {

              element.classList.add(
                "past"
              );

            }


            else if (
              index === currentDay
            ) {

              element.classList.add(
                "current"
              );

            }


            else {

              element.classList.add(
                "future"
              );

            }


          }
        );



      /* =======================================================
         TODAY PROGRESS
         ======================================================= */

      const secondsToday =

        now.getHours() * 3600 +

        now.getMinutes() * 60 +

        now.getSeconds();



      const dayProgress =
        secondsToday / 86400;



      /* =======================================================
         WEEK PROGRESS

         Sunday 00:00 = 0%
         다음 Sunday 00:00 = 100%
         ======================================================= */

      const weekPosition =
        currentDay +
        dayProgress;


      const weekProgress =
        (
          weekPosition /
          7
        ) * 100;



      document
        .getElementById(
          "progressPercent"
        )
        .textContent =

        Math.round(
          weekProgress
        ) + "%";



    }



    /* =========================================================
       INITIAL
       ========================================================= */

    updateHUD();



    /* =========================================================
       AUTO REFRESH

       1분마다 갱신
       ========================================================= */

    setInterval(
      updateHUD,
      60 * 1000
    );


  </script>


</body>
</html>
